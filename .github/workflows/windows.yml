name: Build Windows app

# Builds PptRemoteServer.exe with the .NET runtime bundled inside, so people
# who download it do NOT need to install .NET. Runs on every push/PR that touches
# windows/, on demand, and when you push a version tag like v0.1.0 (which also
# attaches the zip files to a GitHub Release).
on:
  push:
    branches: [main, claude1]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write   # only used to attach files to a release

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish windows/PptRemoteServer.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=0.1.${{ github.run_number }} `
            --output publish/${{ matrix.rid }}

      - name: Add the "READ ME FIRST" file
        shell: pwsh
        run: Copy-Item "windows/dist/README-FIRST.txt" "publish/${{ matrix.rid }}/READ ME FIRST.txt"

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "PptRemote-Windows-${{ matrix.rid }}.zip"

      - name: Keep the zip (Actions > this run > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PptRemote-Windows-${{ matrix.rid }}
          path: PptRemote-Windows-${{ matrix.rid }}.zip
          if-no-files-found: error

      - name: Attach to the GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PptRemote-Windows-${{ matrix.rid }}.zip
